name: Build Canada Windows installer

on:
  push:
    branches: [canada-v1.0.6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canada-v1.0.6-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: pnpm/action-setup@v6
        with:
          version: "9"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Canada source
        shell: pwsh
        run: |
          cargo fmt --all --check
          python crates/apw-core/data/generate.py --self-test
          pnpm test
          pnpm exec tsc --noEmit
          cargo test -p apw-core

      - name: Disable signed updater artifacts for this unsigned custom build
        shell: python
        run: |
          from pathlib import Path
          import json
          path = Path("src-tauri/tauri.conf.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["bundle"]["createUpdaterArtifacts"] = False
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Build Windows NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: apple-store-inventory-monitor-canada-v1.0.6-windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
